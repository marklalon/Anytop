<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>action_labels 人工核验</title>
<style>
  :root {
    --bg: #303030;
    --card: #3a3a3a;
    --card-edge: #4a4a4a;
    --text: #e6e6e6;
    --dim: #9a9a9a;
    --accent: #6fa8ff;
    --ok: #4caf50;
    --warn: #e0704a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: #262626;
    border-bottom: 1px solid #1c1c1c;
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  header .spacer { flex: 1; }
  label.f { color: var(--dim); font-size: 12px; }
  select, input[type=search], input[type=number], button {
    background: #3d3d3d;
    color: var(--text);
    border: 1px solid var(--card-edge);
    border-radius: 4px;
    padding: 4px 8px;
    font: inherit;
  }
  select#dataset { border-color: var(--accent); max-width: 260px; }
  input[type=search] { width: 200px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button#clean:not(:disabled) { border-color: var(--warn); color: #ffb79c; }
  button#clean:hover:not(:disabled) { background: #4a2f2a; }
  .counts { color: var(--dim); font-size: 12px; }
  .counts b { color: var(--text); font-weight: 600; }

  .pager { display: flex; align-items: center; gap: 6px; }
  .pager .page-of { color: var(--dim); min-width: 90px; text-align: center; }
  .pager input { width: 62px; text-align: center; }

  main {
    display: grid;
    grid-template-columns: repeat(auto-fill, 224px);
    justify-content: center;
    gap: 16px 14px;
    padding: 16px;
  }

  .card {
    width: 224px;
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 5px;
    overflow: hidden;
  }
  .card.reviewed { border: 3px solid #43a047; }
  /* pending_delete wins over reviewed: the clip is on its way out either way. */
  .card.pending { border: 3px solid #b4552f; }
  .card.pending .thumb img { filter: grayscale(1) brightness(.62); }
  .card.saving { opacity: .55; }
  .pending-tag {
    position: absolute; top: 0; right: 0;
    padding: 3px 6px;
    background: rgba(180,85,47,.92);
    color: #fff;
    font-size: 10px;
    letter-spacing: .3px;
  }

  .thumb { position: relative; width: 224px; height: 224px; background: #202020; }
  .thumb img { display: block; width: 224px; height: 224px; }
  .thumb.failed { cursor: pointer; }
  .thumb.failed::after {
    content: 'GIF 加载失败 · 点击重试';
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--warn); font-size: 12px;
    text-align: center; padding: 0 8px;
  }
  .clip {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 3px 6px;
    background: rgba(0,0,0,.62);
    color: #fff;
    font-size: 11px;
    text-decoration: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .clip.link { cursor: pointer; }
  .clip.link:hover { color: var(--accent); text-decoration: underline; }
  .clip.link:visited { color: #fff; }
  .group {
    position: absolute; bottom: 0; left: 0;
    padding: 2px 6px;
    background: rgba(0,0,0,.55);
    color: var(--dim);
    font-size: 10px;
    letter-spacing: .3px;
    cursor: pointer;
    max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .group:hover { color: var(--accent); text-decoration: underline; }

  .group-menu {
    position: fixed;
    z-index: 100;
    min-width: 180px;
    max-width: 260px;
    max-height: 260px;
    overflow-y: auto;
    background: #2c2c2c;
    border: 1px solid #4a4a4a;
    border-radius: 5px;
    box-shadow: 0 6px 20px rgba(0,0,0,.55);
    padding: 4px;
  }
  .group-menu .gm-item {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    border-radius: 3px;
    color: var(--text);
    padding: 4px 6px;
    font: inherit;
    cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .group-menu .gm-item:hover { background: #454545; color: var(--accent); }
  .group-menu .gm-item.cur { color: var(--accent); }
  .group-menu .gm-item.cur::after { content: ' ✓'; }
  .group-menu .gm-empty { color: var(--dim); font-size: 11px; padding: 3px 6px; }
  .group-menu .gm-sep { height: 1px; background: #494949; margin: 4px 0; }
  .group-menu .gm-del {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    border-radius: 3px;
    color: var(--warn);
    padding: 5px 6px;
    font: inherit;
    cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .group-menu .gm-del:hover { background: #4a2f2a; color: #ff9a7a; }
  .group-menu .gm-del.cur { color: #ff9a7a; }
  .group-menu .gm-del.cur::after { content: ' ✓'; }

  .row { display: flex; align-items: flex-start; gap: 6px; padding: 6px; }
  .label {
    flex: 1;
    min-width: 0;
    padding: 3px 5px;
    border: 1px solid transparent;
    border-radius: 3px;
    cursor: text;
    word-break: break-word;
  }
  .label:hover { border-color: var(--card-edge); background: #444; }
  .label-input {
    flex: 1;
    min-width: 0;
    padding: 3px 5px;
    border: 1px solid var(--accent);
    border-radius: 3px;
    background: #2a2a2a;
    color: var(--text);
    font: inherit;
  }
  .ok {
    flex: none;
    padding: 3px 9px;
    border-radius: 3px;
    background: #454545;
    font-size: 12px;
  }
  .ok:hover { border-color: var(--ok); color: var(--ok); }
  .tick {
    flex: none; color: #53d656; font-size: 17px; font-weight: 700; line-height: 1.1;
    padding: 0 4px; cursor: pointer; border-radius: 3px;
    background: transparent; border: 1px solid transparent; font-family: inherit;
  }
  .tick:hover { color: var(--warn); background: #454545; border-color: var(--warn); }

  .empty { grid-column: 1 / -1; padding: 60px; text-align: center; color: var(--dim); }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    padding: 9px 16px; border-radius: 4px;
    background: var(--warn); color: #fff;
    box-shadow: 0 3px 12px rgba(0,0,0,.5);
    display: none;
  }

  /* Clean's report stays on screen until dismissed -- the "regenerate the
     sidecar" reminder must not scroll away with a 3.5s toast. */
  #notice {
    position: sticky;
    top: 51px;
    z-index: 9;
    padding: 10px 16px;
    background: #33413a;
    border-bottom: 1px solid #1c1c1c;
    line-height: 1.6;
  }
  #notice.bad { background: #45302a; }
  #notice .n-warn { color: #ffcf8f; }
  #notice code {
    background: #00000055; border-radius: 3px; padding: 1px 5px;
    font-family: Consolas, "Courier New", monospace;
    user-select: all;
  }
  #notice button { margin-top: 6px; }
  #notice[hidden] { display: none; }
</style>
</head>
<body>
<header>
  <label class="f" for="dataset">数据集</label>
  <select id="dataset"><option value="">加载中…</option></select>

  <label class="f" for="group">action group</label>
  <select id="group"><option value="all">all</option></select>

  <label class="f" for="state">状态</label>
  <select id="state">
    <option value="all">all</option>
    <option value="todo">未核验</option>
    <option value="done">已核验</option>
    <option value="pending">待删除</option>
  </select>

  <input type="search" id="q" placeholder="搜索 clip / label">

  <span class="counts" id="counts"></span>
  <span class="spacer"></span>

  <button id="refresh" title="重新读取数据（保留当前数据集 / action group / 状态 / 搜索筛选、页码与滚动位置）">刷新</button>
  <button id="clean" disabled title="清理当前数据集所有标记为待删除的动作">清理待删除</button>

  <div class="pager">
    <button id="prev">上一页</button>
    <span class="page-of" id="pageOf">- / -</span>
    <input id="jump" type="number" min="1" value="1">
    <button id="next">下一页</button>
  </div>
</header>

<div id="notice" hidden></div>
<main id="grid"></main>
<div id="toast"></div>

<script>
const PAGE_SIZE = 100;
const $ = (id) => document.getElementById(id);
const DS_KEY = 'actionReview.dataset';      // remember the chosen dataset across reloads

let datasets = [];  // server's dataset list: [{id, name, total, gif_count, ...}]
let ds = null;      // currently selected dataset id (== the active action_labels file)
let rows = [];      // server truth for the active dataset, in jsonl order
let view = [];      // current filtered subset
let page = 1;
let trashRoot = '';  // where "清理待删除" parks source files (server's --trash)

// A page holds 100 animated GIFs; decoding them all at once is what kills the
// tab. Only cards near the viewport carry a src -- the rest stay empty boxes.
const io = new IntersectionObserver((entries) => {
  for (const e of entries) e.isIntersecting ? mountImg(e.target) : unmountImg(e.target);
}, { rootMargin: '500px 0px', threshold: 0 });

function mountImg(img) {
  img.dataset.live = '1';
  if (!img.getAttribute('src')) img.src = img.dataset.src;
}

function unmountImg(img) {
  delete img.dataset.live;
  img.removeAttribute('src');   // aborts an in-flight load and frees the frames
}

// Detach every image under `root` before it leaves the DOM, so a fast filter
// switch cancels its requests instead of piling up decoded frames.
function dropImgs(root) {
  for (const img of root.querySelectorAll('img')) {
    io.unobserve(img);
    img.onload = img.onerror = null;
    img.removeAttribute('src');
  }
}

const isReviewed = (r) => r.reviewed === true;
const isPending = (r) => r.pending_delete === true;
const stripNpy = (clip) => clip.replace(/\.npy$/i, '');
// GIF lives under /gif/<dataset id>/<clip>.gif on the server.
const gifOf = (clip) => 'gif/' + encodeURIComponent(ds) + '/' + stripNpy(clip) + '.gif';

// Normalize an action_label to "action, word1, word2, ...": lowercase, split
// on comma-family separators (ASCII / full-width / CJK / semicolons), drop
// empty parts, drop repeated words (first occurrence kept), rejoin with a
// single ", " -- mirrors the server's normalize_action_label so the page
// shows exactly what gets saved.
const normalizeLabel = (s) => {
  const seen = new Set();
  return String(s).toLowerCase()
    .split(/[,，、;；]+/)
    .map((p) => p.trim())
    .filter((p) => (p && !seen.has(p) && seen.add(p)))
    .join(', ');
};

function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.style.display = 'none'; }, 3500);
}

function counts() {
  const done = rows.filter(isReviewed).length;
  const pending = rows.filter(isPending).length;
  $('counts').innerHTML = '已核验 <b>' + done + '</b> / ' + rows.length +
    (pending ? ' &nbsp;·&nbsp; 待删除 <b>' + pending + '</b>' : '') +
    ' &nbsp;·&nbsp; 当前筛选 <b>' + view.length + '</b>';
  const clean = $('clean');
  clean.disabled = pending === 0 || clean.dataset.busy === '1';
  clean.textContent = pending ? '清理待删除 (' + pending + ')' : '清理待删除';
}

// A sticky report bar. Unlike the toast it stays until dismissed, so the
// post-clean "regenerate the sidecar" reminder cannot be missed.
function notice(lines, bad) {
  const el = $('notice');
  el.textContent = '';
  el.className = bad ? 'bad' : '';
  for (const line of lines) {
    const div = document.createElement('div');
    if (typeof line === 'string') {
      div.textContent = line;
    } else {
      div.className = line.cls || '';
      div.textContent = line.text;
      if (line.code) {
        const code = document.createElement('code');
        code.textContent = line.code;
        div.append(' ', code);
      }
    }
    el.appendChild(div);
  }
  const close = document.createElement('button');
  close.type = 'button';
  close.textContent = '知道了';
  close.onclick = () => { el.hidden = true; };
  el.appendChild(close);
  el.hidden = false;
  // The header wraps on a narrow window, so pin the bar to its measured height
  // instead of a constant -- otherwise it sticks *under* the header's second row.
  el.style.top = document.querySelector('header').offsetHeight + 'px';
}

const dsOptionText = (d) => d.name + '（' + (d.gif_count ? d.gif_count : '无GIF') + '）';

// Load the dataset <select> once, remembering the previous choice.
async function loadDatasets() {
  let list;
  try {
    const res = await fetch('api/datasets', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const payload = await res.json();
    list = payload.datasets;
    trashRoot = payload.trash_root || '';
  } catch (err) {
    toast('读取数据集清单失败：' + err.message + '（请通过 serve.py 打开本页）');
    return false;
  }
  if (!list.length) {
    toast('datasets.jsonl 中没有可用的数据集');
    return false;
  }
  datasets = list;
  const saved = localStorage.getItem(DS_KEY);
  const found = list.some(d => d.id === saved);
  if (!found) localStorage.setItem(DS_KEY, list[0].id);
  ds = found ? saved : list[0].id;

  const sel = $('dataset');
  sel.innerHTML = list.map(d =>
    '<option value="' + d.id + '">' + dsOptionText(d) + '</option>'
  ).join('');
  sel.value = ds;
  $('counts').textContent = '';
  return true;
}

// Re-read the dataset list to refresh the GIF counts printed in the selector
// (a clean deletes GIFs) without touching the current selection.
async function refreshDatasetCounts() {
  try {
    const res = await fetch('api/datasets', { cache: 'no-store' });
    if (!res.ok) return;
    datasets = (await res.json()).datasets;
    for (const opt of $('dataset').options) {
      const d = datasets.find((x) => x.id === opt.value);
      if (d) opt.textContent = dsOptionText(d);
    }
  } catch (err) { /* option labels only -- not worth a toast */ }
}

// keepView=true 时保留当前分页与滚动位置（刷新场景）；false 时回到第一页/顶部。
async function load(keepView) {
  if (!ds && !(await loadDatasets())) return;   // populate the selector on first call
  let data;
  try {
    const res = await fetch('api/labels?ds=' + encodeURIComponent(ds), { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
  } catch (err) {
    toast('读取 ' + ds + ' 的 action_labels.jsonl 失败：' + err.message + '（请通过 serve.py 打开本页）');
    return;
  }
  rows = data.rows;
  refreshGroups();
  applyFilters(keepView, keepView);
}

// Rebuild the header's action-group <select> options, preserving the current
// selection if it still exists (else fall back to 'all').
function refreshGroups() {
  const prev = $('group').value;
  const groups = [...new Set(rows.map(r => r.action_group))]
    .filter(Boolean)
    .sort();
  $('group').innerHTML = '<option value="all">all</option>' +
    groups.map(g => '<option value="' + g + '">' + g + '</option>').join('');
  $('group').value = groups.includes(prev) ? prev : 'all';
}

function applyFilters(keepPage, keepScroll) {
  const g = $('group').value;
  const s = $('state').value;
  const q = $('q').value.trim().toLowerCase();
  view = rows.filter(r => {
    if (g !== 'all' && r.action_group !== g) return false;
    if (s === 'todo' && isReviewed(r)) return false;
    if (s === 'done' && !isReviewed(r)) return false;
    if (s === 'pending' && !isPending(r)) return false;
    if (q && !(r.clip.toLowerCase().includes(q) ||
               (r.action_label || '').toLowerCase().includes(q))) return false;
    return true;
  });
  if (!keepPage) page = 1;
  render(keepScroll);
}

function render(keepScroll) {
  const y = keepScroll ? window.scrollY : 0;
  const pages = Math.max(1, Math.ceil(view.length / PAGE_SIZE));
  page = Math.min(Math.max(1, page), pages);

  counts();
  $('pageOf').textContent = page + ' / ' + pages;
  $('jump').value = page;
  $('jump').max = pages;
  $('prev').disabled = page <= 1;
  $('next').disabled = page >= pages;

  const grid = $('grid');
  dropImgs(grid);
  grid.textContent = '';
  const slice = view.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
  if (!slice.length) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = '没有匹配的动作';
    grid.appendChild(e);
    return;
  }
  for (const row of slice) grid.appendChild(card(row));
  if (keepScroll) window.scrollTo(0, y);
  else window.scrollTo({ top: 0 });
}

function card(row) {
  const el = document.createElement('div');
  el.className = 'card' + (isReviewed(row) ? ' reviewed' : '') + (isPending(row) ? ' pending' : '');

  const thumb = document.createElement('div');
  thumb.className = 'thumb';
  const img = document.createElement('img');
  img.width = 224;
  img.height = 224;
  img.decoding = 'async';
  img.alt = '';
  img.dataset.src = gifOf(row.clip);
  img.onload = () => thumb.classList.remove('failed');
  img.onerror = () => {
    if (!img.getAttribute('src')) return;         // we cleared it on purpose
    img.removeAttribute('src');
    const tries = (img._tries = (img._tries || 0) + 1);
    if (tries > 2) { thumb.classList.add('failed'); return; }
    setTimeout(() => {
      if (img.isConnected && img.dataset.live) img.src = img.dataset.src + '?r=' + tries;
    }, 400 * tries);
  };
  thumb.onclick = () => {                          // manual retry after a failure
    if (!thumb.classList.contains('failed')) return;
    thumb.classList.remove('failed');
    img._tries = 0;
    img.src = img.dataset.src + '?r=manual' + Date.now();
  };
  io.observe(img);
  const label_ = stripNpy(row.clip);
  const link = row.bvhview;
  const name = document.createElement(link ? 'a' : 'div');
  name.className = 'clip' + (link ? ' link' : '');
  if (link) {
    name.href = link;
    name.rel = 'noopener';
  }
  name.textContent = label_;
  name.title = link ? '在 BVH 查看器中打开 ' + row.clip
                    : row.clip + (stripNpy(row.clip) === row.clip ? '' : '（无对应 BVH）');
  const grp = document.createElement('div');
  grp.className = 'group';
  grp.textContent = row.action_group;
  grp.title = 'action group：' + row.action_group + '（点击修改）';
  grp.onclick = () => openGroupMenu(grp, row, el);
  thumb.append(img, name, grp);
  if (isPending(row)) {
    const tag = document.createElement('div');
    tag.className = 'pending-tag';
    tag.textContent = '待删除';
    tag.title = '已标记 pending_delete；下次清理数据集时移除';
    thumb.appendChild(tag);
  }

  const bar = document.createElement('div');
  bar.className = 'row';
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = row.action_label;
  label.title = '点击修改（保存时规范化为小写 "action, word1, word2" 格式）';
  label.onclick = () => edit(el, row, label);
  bar.appendChild(label);

  if (isReviewed(row)) {
    const tick = document.createElement('button');
    tick.type = 'button';
    tick.className = 'tick';
    tick.textContent = '✓';
    tick.title = '已核验 · 点击取消核验（去掉 reviewed 状态）';
    tick.onclick = () => save(el, row, { reviewed: false });
    bar.appendChild(tick);
  } else {
    const ok = document.createElement('button');
    ok.className = 'ok';
    ok.textContent = 'OK';
    ok.title = '标记为人工核验通过';
    ok.onclick = () => save(el, row, { reviewed: true });
    bar.appendChild(ok);
  }

  el.append(thumb, bar);
  return el;
}

function edit(el, row, label) {
  const input = document.createElement('input');
  input.className = 'label-input';
  input.value = row.action_label;
  let closed = false;

  const finish = (commit) => {
    if (closed) return;
    closed = true;
    const next = normalizeLabel(input.value);
    input.replaceWith(label);
    if (commit && next && next !== row.action_label) save(el, row, { action_label: next });
  };
  input.onkeydown = (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault(); finish(true); }
    else if (ev.key === 'Escape') { ev.preventDefault(); finish(false); }
  };
  input.onblur = () => finish(true);

  label.replaceWith(input);
  input.focus();
  input.select();
}

let _gmEl = null;
let _gmMenu = null;

// Open a popover listing every existing action group plus a free-text field.
function openGroupMenu(anchor, row, cardEl) {
  closeGroupMenu();

  const menu = document.createElement('div');
  menu.className = 'group-menu';

  const current = row.action_group;
  const groups = [...new Set(rows.map(r => r.action_group))]
    .filter(Boolean)
    .sort((a, b) => a.localeCompare(b, 'zh'));

  if (groups.length) {
    for (const g of groups) {
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'gm-item' + (g === current ? ' cur' : '');
      item.textContent = g;
      item.onclick = () => commit(g);
      menu.appendChild(item);
    }
  } else {
    const empty = document.createElement('div');
    empty.className = 'gm-empty';
    empty.textContent = '（暂无可选 group）';
    menu.appendChild(empty);
  }

  // Separator + the retire action. It sets pending_delete rather than blanking
  // action_group: a row without a group makes load_action_labels exit, which
  // takes the sidecar and every tool reading it offline. The group stays valid,
  // and the marked clip is removed for real in a later cleanup pass.
  const sep = document.createElement('div');
  sep.className = 'gm-sep';
  const pending = isPending(row);
  const del = document.createElement('button');
  del.type = 'button';
  del.className = 'gm-del' + (pending ? ' cur' : '');
  del.textContent = pending ? '取消待删除标记' : '标记为待删除';
  del.title = pending
    ? '点击后移除该 clip 的 pending_delete 标记'
    : '点击后给该 clip 打上 pending_delete；action group 保持不变';
  del.onclick = () => {
    const el = _gmEl;
    closeGroupMenu();
    save(el, row, { pending_delete: !pending });
  };
  menu.append(sep, del);

  document.body.appendChild(menu);
  _gmMenu = menu;
  _gmEl = cardEl;

  // Re-measure after layout, then pin under the clicked tag (clamped to screen).
  const r = anchor.getBoundingClientRect();
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  let left = Math.max(4, Math.min(r.left, window.innerWidth - mw - 4));
  let top = r.bottom + 4;
  if (top + mh > window.innerHeight - 4) top = Math.max(4, r.top - mh - 4);
  menu.style.left = left + 'px';
  menu.style.top = top + 'px';

  // Escape or a click anywhere outside the menu dismisses it without saving.
  document.addEventListener('keydown', _gmEsc, true);
  document.addEventListener('mousedown', _gmOutside, true);

  function commit(value) {
    const el = _gmEl;
    closeGroupMenu();
    if (value !== current) save(el, row, { action_group: value });
  }
}

function _gmEsc(ev) {
  if (ev.key === 'Escape') closeGroupMenu();
}

function _gmOutside(ev) {
  if (_gmMenu && !_gmMenu.contains(ev.target)) closeGroupMenu();
}

function closeGroupMenu() {
  if (_gmMenu) _gmMenu.remove();
  _gmMenu = null;
  _gmEl = null;
  document.removeEventListener('mousedown', _gmOutside, true);
  document.removeEventListener('keydown', _gmEsc, true);
}

async function save(el, row, patch) {
  el.classList.add('saving');
  try {
    const res = await fetch('api/update', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ dataset: ds, clip: row.clip }, patch))
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.status);
    // Adopt the row the file now holds, so the page mirrors the jsonl exactly.
    for (const k of Object.keys(row)) if (!(k in data.row)) delete row[k];
    Object.assign(row, data.row);
    if (patch.action_group !== undefined || patch.pending_delete !== undefined) {
      // A group change can move the clip into/out of the current filter, and
      // may add a new group option — rebuild the list and re-run the filter.
      // pending_delete moves it into/out of the 待删除 filter the same way.
      // Keep both the current page and the scroll offset so an inline edit
      // doesn't yank the viewport back to the top.
      refreshGroups();
      applyFilters(true, true);
    } else {
      dropImgs(el);
      el.replaceWith(card(row));
      counts();
    }
  } catch (err) {
    toast('保存失败：' + err.message);
    el.classList.remove('saving');
  }
}

// Turn every pending_delete mark of the active dataset into a real removal:
// the source file is moved into the trash dir, the review GIF is deleted, and
// the row leaves action_labels.jsonl. Reloads afterwards so the counts on
// screen (and the selector's GIF count) match what is left on disk.
async function clean() {
  const pending = rows.filter(isPending);
  if (!pending.length) return;
  const shown = pending.slice(0, 12).map(r => '  · ' + stripNpy(r.clip));
  if (pending.length > shown.length) shown.push('  … 其余 ' + (pending.length - shown.length) + ' 个');
  const ok = confirm(
    '清理 ' + ds + ' 中 ' + pending.length + ' 个待删除动作：\n\n' +
    shown.join('\n') + '\n\n' +
    '1) 源文件移动到 ' + (trashRoot || '回收目录') + '（软删除，不是彻底删除）\n' +
    '2) 删除 review/gif 下对应的 GIF\n' +
    '3) 从 action_labels.jsonl 删除对应行\n\n继续？');
  if (!ok) return;

  const btn = $('clean');
  btn.dataset.busy = '1';
  btn.disabled = true;
  btn.textContent = '清理中…';
  let data;
  try {
    const res = await fetch('api/clean', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dataset: ds })
    });
    data = await res.json();
    if (!res.ok) throw new Error(data.error || res.status);
  } catch (err) {
    toast('清理失败：' + err.message);
    return;
  } finally {
    delete btn.dataset.busy;
    await refreshDatasetCounts();
    await load(true);          // rows/counts/pager come back from the file itself
  }

  const lines = [
    '已清理 ' + data.removed + ' 个动作：源文件归档 ' + data.moved + ' 个 → ' +
    data.trash_root + '，删除 GIF ' + data.gifs + ' 个，action_labels.jsonl 移除 ' +
    data.removed + ' 行。'
  ];
  for (const s of data.skipped) lines.push('跳过 ' + stripNpy(s.clip) + '：' + s.reason + '（标记保留）');
  for (const n of data.notes) lines.push(n);
  lines.push({
    cls: 'n-warn',
    text: '⚠ action_labels.jsonl 已变，请重新生成 sidecar（action_label_embs.npy），否则训练读到的还是旧标签：',
    code: 'python tools/build_action_label_embeddings.py "' + data.processed + '" --force'
  });
  notice(lines, data.skipped.length > 0);
}

// Switching dataset resets the per-dataset filters and scrolls back to the top.
function onDatasetChange() {
  const next = $('dataset').value;
  if (!next || next === ds) return;
  ds = next;
  localStorage.setItem(DS_KEY, ds);
  rows = [];
  $('group').innerHTML = '<option value="all">all</option>';
  $('group').value = 'all';
  $('state').value = 'all';
  $('q').value = '';
  page = 1;
  $('notice').hidden = true;   // the report belongs to the dataset that produced it
  window.scrollTo({ top: 0 });
  load(false);
}

$('dataset').onchange = onDatasetChange;
$('group').onchange = () => applyFilters();
$('state').onchange = () => applyFilters();
$('q').oninput = () => {                 // debounce: a keystroke must not rebuild 100 cards
  clearTimeout($('q')._t);
  $('q')._t = setTimeout(() => applyFilters(), 200);
};
$('prev').onclick = () => { page--; render(); };
$('next').onclick = () => { page++; render(); };
$('jump').onchange = () => { page = parseInt($('jump').value, 10) || 1; render(); };
$('refresh').onclick = () => load(true);
$('clean').onclick = clean;

load();
</script>
</body>
