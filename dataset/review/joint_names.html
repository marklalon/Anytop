<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>关节名预览</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #303030;
    --panel: #2a2a2a;
    --bar: #262626;
    --edge: #4a4a4a;
    --text: #e6e6e6;
    --dim: #9a9a9a;
    --accent: #6fa8ff;
    --bad: #e0704a;
    --row-hover: #353535;
    --row-sel: #2d4466;
    --view-bg: #1f1f1f;
    --grid: #3a3a3a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    grid-template-rows: auto 1fr auto;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
  }
  header, footer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    background: var(--bar);
    border-bottom: 1px solid var(--edge);
  }
  footer { border-top: 1px solid var(--edge); border-bottom: 0; }
  .spacer { flex: 1; }
  label.f { color: var(--dim); font-size: 12px; }
  select, input[type=search], button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--edge);
    border-radius: 4px;
    padding: 4px 8px;
    font: inherit;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .counts { color: var(--dim); font-size: 12px; }

  main {
    display: grid;
    grid-template-columns: 230px 1fr 520px;
    min-height: 0;
  }
  #species {
    overflow-y: auto;
    border-right: 1px solid var(--edge);
    background: var(--panel);
  }
  .sp {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    cursor: pointer;
    white-space: nowrap;
  }
  .sp:hover { background: var(--row-hover); }
  .sp.active { background: var(--row-sel); }
  .sp .nm { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .sp .n { color: var(--dim); font-size: 11px; }

  #viewWrap { position: relative; min-width: 0; min-height: 0; background: var(--view-bg); }
  #view { position: absolute; inset: 0; }
  #view canvas { display: block; }
  #tip {
    position: absolute;
    pointer-events: none;
    padding: 4px 8px;
    background: rgba(0,0,0,.82);
    color: #eee;
    border-radius: 4px;
    font-size: 12px;
    max-width: 360px;
    white-space: pre-wrap;
    z-index: 5;
  }
  #tip[hidden] { display: none; }
  #box {
    position: absolute;
    border: 1px dashed var(--accent);
    background: rgba(111,168,255,.12);
    pointer-events: none;
  }
  #box[hidden] { display: none; }
  .viewbtns { position: absolute; top: 8px; left: 8px; display: flex; gap: 4px; z-index: 4; }
  .viewbtns button { padding: 2px 8px; font-size: 12px; opacity: .85; }
  .legend { position: absolute; top: 8px; right: 10px; z-index: 4; display: flex; gap: 10px;
    font-size: 12px; color: var(--dim); }
  #title {
    position: absolute; bottom: 8px; left: 10px; z-index: 4;
    color: var(--dim); font-size: 12px; pointer-events: none;
  }
  #title b { color: var(--text); font-size: 14px; }
  #transport {
    position: absolute; bottom: 8px; left: 10px; right: 10px; z-index: 4;
    display: flex; align-items: center; gap: 6px;
    padding: 4px 8px;
    background: rgba(0,0,0,.55);
    border-radius: 4px;
  }
  #transport[hidden] { display: none; }
  #transport button { padding: 1px 8px; font-size: 12px; }
  #transport select { padding: 1px 4px; font-size: 12px; }
  #scrub { flex: 1; min-width: 60px; accent-color: var(--accent); }
  #frameNo { color: var(--dim); font: 11px ui-monospace, Consolas, monospace; white-space: nowrap; min-width: 72px; text-align: right; }
  #transport:not([hidden]) ~ #title { bottom: 46px; }
  #title button { pointer-events: auto; padding: 0 6px; margin-left: 4px; font-size: 11px; opacity: .85; }

  #side { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--edge); background: var(--panel); }
  #tableWrap { overflow-y: auto; flex: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead th {
    position: sticky; top: 0;
    background: var(--bar);
    text-align: left;
    font-weight: 600;
    padding: 4px 6px;
    border-bottom: 1px solid var(--edge);
    z-index: 1;
  }
  tbody td { padding: 1px 6px; border-bottom: 1px solid color-mix(in srgb, var(--edge) 40%, transparent); white-space: nowrap; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr.sel { background: var(--row-sel); }
  tbody tr.twin td.nm { color: var(--accent); }
  td.idx { color: var(--dim); text-align: right; width: 28px; }
  td.nm, td.cn { max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
  td.cn, td.tw { color: var(--dim); }
  td.tx { max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
  td.tx.blank { color: var(--dim); font-style: italic; }
  td.tw { max-width: 90px; overflow: hidden; text-overflow: ellipsis; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; }

  #help { border-top: 1px solid var(--edge); padding: 6px 10px; font-size: 12px; color: var(--dim); }
  #status { color: var(--dim); font-size: 12px; min-width: 120px; }
  #clip { max-width: 220px; }
  #play { min-width: 32px; }
  #status.err { color: var(--bad); }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/" } }
</script>
</head>
<body>
<header>
  <label class="f" for="dataset">数据集</label>
  <select id="dataset"></select>
  <input type="search" id="q" placeholder="搜索物种">
  <span class="counts" id="count"></span>
  <span class="spacer"></span>
  <a href="/" title="action_labels 核验页">动作标签 ↗</a>
</header>

<main>
  <div id="species"></div>
  <div id="viewWrap">
    <div id="view"></div>
    <div class="viewbtns">
      <button data-view="front" title="正视（小键盘 1）">正</button>
      <button data-view="side" title="侧视（小键盘 3）">侧</button>
      <button data-view="top" title="俯视（小键盘 7）">俯</button>
      <button data-view="fit" title="重新取景（小键盘 .）">⤢</button>
    </div>
    <div class="legend" id="legend"></div>
    <div id="transport" hidden>
      <button id="play" title="暂停 / 播放（空格）">⏸</button>
      <button id="stepBack" title="上一帧（,）">‹</button>
      <button id="stepFwd" title="下一帧（.）">›</button>
      <input type="range" id="scrub" min="0" max="0" step="any" value="0" title="拖动定位（拖动时暂停）">
      <span id="frameNo"></span>
      <select id="speed" title="播放速度">
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="1">1×</option>
        <option value="2">2×</option>
      </select>
    </div>
    <div id="title"></div>
    <div id="tip" hidden></div>
    <div id="box" hidden></div>
  </div>
  <div id="side">
    <div id="tableWrap">
      <table>
        <thead><tr><th>#</th><th>名字</th><th>Canonical</th><th title="T5 joint-name embedding text">EmbedText</th><th>侧</th><th title="mirror twin">镜像</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="help">
      视口：中键旋转，Shift+中键 / 右键平移，滚轮缩放；左键单击选择，Shift+单击选整棵子树，Ctrl+单击增减，左键拖框多选。
      关节按侧着色；选中关节外圈黄色，它们的镜像关节外圈蓝色。EmbedText 为空的关节进模型时名字是全零。
    </div>
  </div>
</main>

<footer>
  <span id="status"></span>
  <span class="spacer"></span>
  <label class="f" for="clip">动作</label>
  <select id="clip" title="在视口里播放该物种的动作（← / → 切换）"></select>
</footer>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/OrbitControls.js';
import { BVHLoader } from 'three/addons/BVHLoader.js';

const SIDE_COLORS = { left: '#4f8fe6', right: '#e05a5a', center: '#b8b8b8' };
const SIDE_LABELS = { left: '左', right: '右', center: '中' };

const $ = (id) => document.getElementById(id);
let hoverIndex = null;   // joint under the cursor (viewport or table)
// The dataset selector's aggregate entry; species then carry their own ``ds``.
const ALL_DATASETS = 'all';
const state = {
  ds: null,           // selected dataset id, or ALL_DATASETS
  datasets: [],
  species: [],        // species-list rows, each tagged with its dataset id ``ds``
  current: null,      // skeleton payload, tagged with ``ds``
  opening: null,      // speciesKey being loaded, so arrow keys step from it
  selected: new Set(),
  anchor: null,       // last clicked table row, for shift ranges
  loadToken: 0,
};

function setStatus(text, isError = false) {
  $('status').textContent = text;
  $('status').classList.toggle('err', isError);
}

async function api(path) {
  const res = await fetch(path);
  const isJson = (res.headers.get('Content-Type') || '').includes('json');
  const data = isJson ? await res.json() : await res.text();
  if (!res.ok) throw new Error(isJson ? data.error : data);
  return data;
}

function remember(key, value) { try { localStorage.setItem('joints.' + key, value); } catch (e) { /* storage off */ } }
function recall(key) { try { return localStorage.getItem('joints.' + key); } catch (e) { return null; } }

// ---------------------------------------------------------------------------
// Species list
// ---------------------------------------------------------------------------

const speciesKey = (s) => s.ds + '\t' + s.species;
const datasetName = (id) => (state.datasets.find((d) => d.id === id) || { name: id }).name;
// The species the list highlights and the arrow keys step from.
const activeKey = () => state.opening || (state.current && speciesKey(state.current));

function visibleSpecies() {
  const query = $('q').value.trim().toLowerCase();
  return state.species.filter((s) => !query || s.species.toLowerCase().includes(query));
}

function renderSpecies() {
  const box = $('species');
  box.textContent = '';
  const list = visibleSpecies();
  for (const s of list) {
    const div = document.createElement('div');
    div.className = 'sp' + (speciesKey(s) === activeKey() ? ' active' : '');
    const where = state.ds === ALL_DATASETS ? `${datasetName(s.ds)}\n` : '';
    div.title = `${where}${s.joints} 关节，${s.blank} 个 EmbedText 为空`;
    div.innerHTML = `<span class="nm"></span><span class="n">${s.joints}</span>`;
    div.querySelector('.nm').textContent = s.species;
    div.addEventListener('click', () => openSpecies(s));
    box.appendChild(div);
  }
  $('count').textContent = `${list.length} / ${state.species.length} 个物种`;
}

const datasetOptionText = (name, count) => (count == null ? name : `${name}（${count}）`);

async function loadDatasets() {
  const { datasets } = await api('/api/joints/datasets');
  state.datasets = datasets;
  const sel = $('dataset');
  sel.textContent = '';
  const total = datasets.reduce((n, d) => n + (Number(d.species) || 0), 0);
  sel.add(new Option(datasetOptionText('all', total), ALL_DATASETS));
  for (const d of datasets) sel.add(new Option(datasetOptionText(d.name, d.species), d.id));
  const saved = recall('ds');
  sel.value = saved === ALL_DATASETS || datasets.some((d) => d.id === saved) ? saved
    : datasets.length ? datasets[0].id : ALL_DATASETS;
  await switchDataset(sel.value);
}

async function switchDataset(id) {
  state.ds = id;
  remember('ds', id);
  const ids = id === ALL_DATASETS ? state.datasets.map((d) => d.id) : [id];
  const lists = await Promise.all(ids.map((ds) => api(`/api/joints/species?ds=${encodeURIComponent(ds)}`)));
  if (state.ds !== id) return;
  state.species = lists.flatMap((data, k) => data.species.map((s) => ({ ...s, ds: ids[k] })));
  if (id === ALL_DATASETS) {
    state.species.sort((a, b) => a.species.toLowerCase().localeCompare(b.species.toLowerCase())
      || a.ds.localeCompare(b.ds));
  }
  closeSpecies();
  renderSpecies();
  // Saved as a speciesKey; a bare species name is one saved per dataset.
  const saved = recall('species.' + id) || '';
  const savedKey = saved.includes('\t') ? saved : `${id}\t${saved}`;
  const target = state.species.find((s) => speciesKey(s) === savedKey) || visibleSpecies()[0];
  if (target) await openSpecies(target);
}

// ---------------------------------------------------------------------------
// Viewport
// ---------------------------------------------------------------------------

const view = $('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.001, 1000);
const controls = new OrbitControls(camera, renderer.domElement);
// Left button is selection; rotate on middle (Shift+middle pans), pan on right.
controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.ROTATE, RIGHT: THREE.MOUSE.PAN };
controls.enableDamping = false;
scene.add(new THREE.HemisphereLight(0xffffff, 0x404040, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(1, 2, 1.5);
scene.add(sun);

// ``positions`` is the pose on screen (picking reads it too); ``rest`` the t-pose.
const skel = {
  group: null, positions: [], rest: [], radius: 0.01, diag: 1, center: new THREE.Vector3(),
  solid: null, halo: null, twinHalo: null, lines: null,
};
// The clip playing in the viewport (see parseBVH).
let anim = null;      // { bvh (parseBVH), order, time, playing }
let clipToken = 0;
const clock = new THREE.Clock();

function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function resize() {
  const { clientWidth: w, clientHeight: h } = view;
  if (!w || !h) return;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);

scene.background = new THREE.Color(cssVar('--view-bg'));
$('legend').innerHTML = Object.entries(SIDE_COLORS)
  .map(([side, color]) => `<span><span class="sw" style="background:${color}"></span> ${SIDE_LABELS[side]}</span>`).join('');

function disposeSkeleton() {
  stopClip();
  if (!skel.group) return;
  skel.group.traverse((obj) => {
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) obj.material.dispose();
  });
  scene.remove(skel.group);
  skel.group = null;
}

// Parse a BVH into its joints (ENDSITEs dropped) and per-frame local poses.
// A position channel *replaces* the joint's OFFSET, as motion_lib.BVH reads it;
// three's BVHLoader adds the two, which lifts a root that has a non-zero OFFSET
// and doubles every bone with position channels. Frames are applied by hand,
// not through an AnimationMixer, whose track binding rejects joint names
// containing '.' or ':'.
function parseBVH(text, jointCount) {
  const result = new BVHLoader().parse(text);
  const bones = result.skeleton.bones.filter((bone) => bone.name !== 'ENDSITE');
  if (bones.length !== jointCount) throw new Error(`BVH 有 ${bones.length} 个关节，cond 有 ${jointCount} 个`);
  // Position channels per ROOT/JOINT, in hierarchy order (the bones' order).
  const hasPosition = [];
  for (const line of text.split(/^MOTION/m)[0].split('\n')) {
    const t = line.trim();
    if (/^(ROOT|JOINT)\s/.test(t)) hasPosition.push(false);
    else if (t.startsWith('CHANNELS') && /position/i.test(t)) hasPosition[hasPosition.length - 1] = true;
  }
  // The loader emits a position then a quaternion track per joint, in bone order.
  const tracks = result.clip.tracks;
  const frames = tracks.length ? tracks[1].times.length : 1;
  const pos = bones.map((bone, k) => {
    const values = Float32Array.from(tracks[2 * k].values);
    if (hasPosition[k]) {
      for (let f = 0; f < frames; f++) {
        values[3 * f] -= bone.position.x;
        values[3 * f + 1] -= bone.position.y;
        values[3 * f + 2] -= bone.position.z;
      }
    }
    return values;
  });
  const quat = bones.map((_, k) => tracks[2 * k + 1].values);
  const frameTime = Number((/^Frame Time:\s*([\d.eE+-]+)/m.exec(text) || [])[1]) || 1 / 30;
  const root = new THREE.Object3D();
  root.add(result.skeleton.bones[0]);
  return { root, bones, pos, quat, frames, frameTime };
}

const tmpVec = new THREE.Vector3();
const tmpQuat = new THREE.Quaternion();

// Pose ``bvh`` at fractional frame ``t`` (positions lerped, rotations slerped
// between the two neighbouring frames) and write each joint's world position
// to ``out[order[k]]``.
function sampleBVH(bvh, t, order, out) {
  const f0 = Math.min(Math.floor(t), bvh.frames - 1);
  const f1 = Math.min(f0 + 1, bvh.frames - 1);
  const w = Math.min(Math.max(t - f0, 0), 1);
  bvh.bones.forEach((bone, k) => {
    bone.position.fromArray(bvh.pos[k], 3 * f0).lerp(tmpVec.fromArray(bvh.pos[k], 3 * f1), w);
    bone.quaternion.fromArray(bvh.quat[k], 4 * f0).slerp(tmpQuat.fromArray(bvh.quat[k], 4 * f1), w);
  });
  bvh.root.updateMatrixWorld(true);
  bvh.bones.forEach((bone, k) => bone.getWorldPosition(out[order[k]]));
}

function buildSkeleton(bvhText, payload) {
  disposeSkeleton();
  const order = payload.bvh_order;
  const positions = order.map(() => new THREE.Vector3());
  sampleBVH(parseBVH(bvhText, order.length), 0, order, positions);
  skel.positions = positions;
  skel.rest = positions.map((p) => p.clone());

  const box = new THREE.Box3().setFromPoints(positions);
  skel.diag = Math.max(box.getSize(new THREE.Vector3()).length(), 1e-6);
  box.getCenter(skel.center);
  skel.radius = skel.diag * 0.011;

  const group = new THREE.Group();
  const sphere = new THREE.SphereGeometry(1, 16, 12);
  const count = positions.length;
  skel.solid = new THREE.InstancedMesh(sphere, new THREE.MeshStandardMaterial({ roughness: .55 }), count);
  skel.halo = new THREE.InstancedMesh(sphere, new THREE.MeshBasicMaterial({ color: 0xffd23f, side: THREE.BackSide }), count);
  skel.twinHalo = new THREE.InstancedMesh(sphere, new THREE.MeshBasicMaterial({ color: 0x6fa8ff, side: THREE.BackSide }), count);
  for (const mesh of [skel.solid, skel.halo, skel.twinHalo]) {
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    group.add(mesh);
  }

  const lineGeo = new THREE.BufferGeometry();
  const segments = payload.joints.filter((j) => j.parent >= 0);
  lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(segments.length * 6, 3));
  lineGeo.setAttribute('color', new THREE.Float32BufferAttribute(segments.length * 6, 3));
  skel.lines = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({ vertexColors: true }));
  skel.lines.userData.segments = segments.map((j) => j.index);
  group.add(skel.lines);

  // Floor grid at Y=0, the processed data's ground.
  const grid = new THREE.GridHelper(skel.diag * 2, 20, cssVar('--grid'), cssVar('--grid'));
  grid.position.set(skel.center.x, 0, skel.center.z);
  grid.material.transparent = true;
  grid.material.opacity = .6;
  group.add(grid);

  scene.add(group);
  skel.group = group;
  applyPose();
}

const tmpMatrix = new THREE.Matrix4();
const zeroMatrix = new THREE.Matrix4().makeScale(0, 0, 0);
const tmpColor = new THREE.Color();

function refreshVisuals() {
  if (!skel.group || !state.current) return;
  const joints = state.current.joints;
  const twins = new Set([...state.selected].map((i) => joints[i].twin).filter((t) => t >= 0 && !state.selected.has(t)));
  const r = skel.radius, hr = r * 1.55;
  joints.forEach((j) => {
    const p = skel.positions[j.index];
    skel.solid.setMatrixAt(j.index, tmpMatrix.makeScale(r, r, r).setPosition(p));
    skel.solid.setColorAt(j.index, tmpColor.set(SIDE_COLORS[j.side] || SIDE_COLORS.center));
    skel.halo.setMatrixAt(j.index, state.selected.has(j.index)
      ? tmpMatrix.makeScale(hr, hr, hr).setPosition(p) : zeroMatrix);
    skel.twinHalo.setMatrixAt(j.index, twins.has(j.index)
      ? tmpMatrix.makeScale(hr, hr, hr).setPosition(p) : zeroMatrix);
  });
  for (const mesh of [skel.solid, skel.halo, skel.twinHalo]) {
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    mesh.computeBoundingSphere();
  }
  const colors = skel.lines.geometry.getAttribute('color');
  skel.lines.userData.segments.forEach((child, s) => {
    tmpColor.set(SIDE_COLORS[joints[child].side] || SIDE_COLORS.center);
    colors.setXYZ(2 * s, tmpColor.r, tmpColor.g, tmpColor.b);
    colors.setXYZ(2 * s + 1, tmpColor.r, tmpColor.g, tmpColor.b);
  });
  colors.needsUpdate = true;
}

function setView(kind) {
  if (!skel.group) return;
  const dist = skel.diag * 1.25;
  const dirs = {
    front: new THREE.Vector3(0, 0, 1), side: new THREE.Vector3(1, 0, 0),
    top: new THREE.Vector3(0, 1, 0.0001), fit: new THREE.Vector3(0.8, 0.45, 1).normalize(),
  };
  camera.near = skel.diag / 500;
  camera.far = skel.diag * 50;
  camera.updateProjectionMatrix();
  controls.target.copy(skel.center);
  camera.position.copy(skel.center).addScaledVector(dirs[kind], dist);
  controls.update();
}

document.querySelectorAll('.viewbtns button').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));

// Move bones and spheres to skel.positions.
function applyPose() {
  if (!skel.group) return;
  const joints = state.current.joints;
  const linePos = skel.lines.geometry.getAttribute('position');
  skel.lines.userData.segments.forEach((child, s) => {
    const a = skel.positions[joints[child].parent], b = skel.positions[child];
    linePos.setXYZ(2 * s, a.x, a.y, a.z);
    linePos.setXYZ(2 * s + 1, b.x, b.y, b.z);
  });
  linePos.needsUpdate = true;
  skel.lines.geometry.computeBoundingSphere();
  refreshVisuals();
}

// Pose the joints from the clip at ``anim.time``.
function poseFromClip() {
  const { bvh } = anim;
  sampleBVH(bvh, anim.time / bvh.frameTime, anim.order, skel.positions);
  applyPose();
}

function stopClip() {
  clipToken++;
  anim = null;
  $('transport').hidden = true;
  $('play').textContent = '⏸';
}

function setPlaying(on) {
  if (!anim) return;
  anim.playing = on;
  $('play').textContent = on ? '⏸' : '▶';
}

// Playback loops over [first frame, last frame]: the last key is held, not blended into the first.
const lastFrame = () => Math.max(anim.bvh.frames - 1, 0);
const loopLength = () => Math.max(lastFrame() * anim.bvh.frameTime, anim.bvh.frameTime);

function syncTransport() {
  const frame = anim.time / anim.bvh.frameTime;
  $('scrub').value = frame;
  $('frameNo').textContent = `${Math.min(Math.floor(frame + 1e-6), lastFrame()) + 1} / ${anim.bvh.frames}`;
}

function seekFrame(frame) {
  if (!anim) return;
  setPlaying(false);
  anim.time = Math.min(Math.max(frame, 0), lastFrame()) * anim.bvh.frameTime;
  poseFromClip();
  syncTransport();
}

function stepFrame(delta) {
  if (!anim) return;
  const n = lastFrame() + 1;
  seekFrame((((Math.round(anim.time / anim.bvh.frameTime) + delta) % n) + n) % n);
}

let playbackSpeed = Number(recall('speed')) || 1;

// Fill the clip dropdown for the open species; TPose (no clip) is selected.
function fillClipOptions(clips, species) {
  const sel = $('clip');
  sel.textContent = '';
  sel.add(new Option('TPose', ''));
  for (const clip of clips) {
    const opt = new Option(clip.startsWith(species + '_') ? clip.slice(species.length + 1) : clip, clip);
    opt.title = clip;
    sel.add(opt);
  }
  sel.value = '';
  sel.disabled = !clips.length;
}

async function playClip(clip) {
  stopClip();
  if (!state.current || !skel.group) return;
  if (!clip) {
    skel.rest.forEach((p, index) => skel.positions[index].copy(p));
    applyPose();
    return;
  }
  const token = clipToken;
  const { ds, species } = state.current;
  setStatus(`加载动作 ${clip}…`);
  try {
    const q = `ds=${encodeURIComponent(ds)}&species=${encodeURIComponent(species)}&clip=${encodeURIComponent(clip)}`;
    const text = await api(`/api/joints/clip.bvh?${q}`);
    if (token !== clipToken) return;
    const order = state.current.bvh_order;
    const bvh = parseBVH(text, order.length);
    anim = { bvh, order, time: 0, playing: true };
    $('scrub').max = lastFrame();
    $('transport').hidden = false;
    setPlaying(true);
    clock.getDelta();
    poseFromClip();
    syncTransport();
    setStatus(`${clip}：${bvh.frames} 帧`);
  } catch (err) {
    if (token !== clipToken) return;
    $('clip').value = '';
    setStatus(`动作加载失败：${err.message}`, true);
  }
}

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  if (anim && anim.playing) {
    anim.time = (anim.time + dt * playbackSpeed) % loopLength();
    poseFromClip();
    syncTransport();
  }
  renderer.render(scene, camera);
}
animate();

// -- picking --------------------------------------------------------------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function pick(event) {
  if (!skel.group) return null;
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.set(((event.clientX - rect.left) / rect.width) * 2 - 1, -((event.clientY - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(skel.solid, false);
  if (hits.length) return hits[0].instanceId;
  // Fall back to the nearest joint within a few pixels: small spheres are hard to hit.
  let best = null, bestDist = 8;
  skel.positions.forEach((p, index) => {
    const s = p.clone().project(camera);
    const x = (s.x + 1) / 2 * rect.width, y = (1 - s.y) / 2 * rect.height;
    const d = Math.hypot(x - (event.clientX - rect.left), y - (event.clientY - rect.top));
    if (s.z < 1 && d < bestDist) { best = index; bestDist = d; }
  });
  return best;
}

function jointTip(j) {
  const twin = j.twin >= 0 ? state.current.joints[j.twin].name : '—';
  return `${j.name}\nCanonical: ${j.canonical}\nEmbedText: ${j.text || '（空）'}\n侧：${SIDE_LABELS[j.side] || j.side} · 镜像：${twin}`;
}

let drag = null;
renderer.domElement.addEventListener('pointerdown', (event) => {
  if (event.button !== 0) return;
  const rect = renderer.domElement.getBoundingClientRect();
  drag = { x: event.clientX - rect.left, y: event.clientY - rect.top, moved: false, event };
  renderer.domElement.setPointerCapture(event.pointerId);
});
renderer.domElement.addEventListener('pointermove', (event) => {
  const rect = renderer.domElement.getBoundingClientRect();
  const x = event.clientX - rect.left, y = event.clientY - rect.top;
  if (drag) {
    if (Math.hypot(x - drag.x, y - drag.y) > 4) drag.moved = true;
    if (drag.moved) {
      const box = $('box');
      box.hidden = false;
      box.style.left = Math.min(x, drag.x) + 'px';
      box.style.top = Math.min(y, drag.y) + 'px';
      box.style.width = Math.abs(x - drag.x) + 'px';
      box.style.height = Math.abs(y - drag.y) + 'px';
    }
    $('tip').hidden = true;
    return;
  }
  const index = state.current ? pick(event) : null;
  hoverIndex = index;
  const tip = $('tip');
  if (index === null) { tip.hidden = true; return; }
  tip.textContent = jointTip(state.current.joints[index]);
  tip.hidden = false;
  tip.style.left = Math.min(x + 14, rect.width - tip.offsetWidth - 4) + 'px';
  tip.style.top = Math.min(y + 14, rect.height - tip.offsetHeight - 4) + 'px';
});
renderer.domElement.addEventListener('pointerleave', () => { $('tip').hidden = true; hoverIndex = null; });
renderer.domElement.addEventListener('pointerup', (event) => {
  if (!drag || event.button !== 0) return;
  const start = drag;
  drag = null;
  $('box').hidden = true;
  if (!state.current) return;
  if (start.moved) {
    const rect = renderer.domElement.getBoundingClientRect();
    const x0 = Math.min(start.x, event.clientX - rect.left), x1 = Math.max(start.x, event.clientX - rect.left);
    const y0 = Math.min(start.y, event.clientY - rect.top), y1 = Math.max(start.y, event.clientY - rect.top);
    const inside = [];
    skel.positions.forEach((p, index) => {
      const s = p.clone().project(camera);
      const x = (s.x + 1) / 2 * rect.width, y = (1 - s.y) / 2 * rect.height;
      if (s.z < 1 && x >= x0 && x <= x1 && y >= y0 && y <= y1) inside.push(index);
    });
    select(inside, event.shiftKey || event.ctrlKey ? 'add' : 'set');
    return;
  }
  const index = pick(event);
  if (index === null) {
    if (!event.ctrlKey && !event.shiftKey) select([], 'set');
    return;
  }
  if (event.shiftKey) select(subtree(index), event.ctrlKey ? 'add' : 'set');
  else if (event.ctrlKey || event.metaKey) select([index], 'toggle');
  else select([index], 'set');
  state.anchor = index;
});

function subtree(root) {
  const out = [root];
  const joints = state.current.joints;
  for (let i = 0; i < out.length; i++) {
    for (const j of joints) if (j.parent === out[i]) out.push(j.index);
  }
  return out;
}

// ---------------------------------------------------------------------------
// Selection and the joint table
// ---------------------------------------------------------------------------

function select(indices, mode) {
  if (mode === 'set') state.selected = new Set(indices);
  else if (mode === 'add') indices.forEach((i) => state.selected.add(i));
  else if (mode === 'toggle') indices.forEach((i) => (state.selected.has(i) ? state.selected.delete(i) : state.selected.add(i)));
  refreshVisuals();
  syncTableSelection(true);
}

function syncTableSelection(scroll) {
  let first = null;
  const joints = state.current ? state.current.joints : [];
  const twins = new Set([...state.selected].map((i) => joints[i].twin).filter((t) => t >= 0));
  $('rows').querySelectorAll('tr').forEach((tr) => {
    const index = Number(tr.dataset.index);
    const on = state.selected.has(index);
    tr.classList.toggle('sel', on);
    tr.classList.toggle('twin', !on && twins.has(index));
    if (on && first === null) first = tr;
  });
  if (scroll && first) first.scrollIntoView({ block: 'nearest' });
}

function renderTable() {
  const tbody = $('rows');
  tbody.textContent = '';
  if (!state.current) return;
  const joints = state.current.joints;
  for (const j of joints) {
    const tr = document.createElement('tr');
    tr.dataset.index = j.index;
    tr.title = jointTip(j);
    const cells = [
      ['idx', String(j.index)],
      ['nm', j.name],
      ['cn', j.canonical],
      ['tx' + (j.text ? '' : ' blank'), j.text || '（空）'],
    ];
    for (const [cls, text] of cells) {
      const td = document.createElement('td');
      td.className = cls;
      td.textContent = text;
      tr.appendChild(td);
    }
    const side = document.createElement('td');
    side.innerHTML = `<span class="sw" style="background:${SIDE_COLORS[j.side] || SIDE_COLORS.center}"></span> `;
    side.appendChild(document.createTextNode(SIDE_LABELS[j.side] || j.side));
    tr.appendChild(side);
    const twin = document.createElement('td');
    twin.className = 'tw';
    twin.textContent = j.twin >= 0 ? joints[j.twin].name : '';
    tr.appendChild(twin);
    tr.addEventListener('click', (event) => {
      const index = j.index;
      if (event.shiftKey && state.anchor !== null) {
        const [a, b] = [Math.min(state.anchor, index), Math.max(state.anchor, index)];
        select(Array.from({ length: b - a + 1 }, (_, k) => a + k), event.ctrlKey ? 'add' : 'set');
      } else if (event.ctrlKey || event.metaKey) {
        select([index], 'toggle');
        state.anchor = index;
      } else {
        select([index], 'set');
        state.anchor = index;
      }
    });
    tr.addEventListener('mouseenter', () => { hoverIndex = j.index; });
    tbody.appendChild(tr);
  }
  syncTableSelection(false);
}
$('rows').addEventListener('mouseleave', () => { hoverIndex = null; });

function renderTitle() {
  const s = state.current;
  if (!s) { $('title').textContent = ''; return; }
  const tags = s.species_tags.length ? ` · ${s.species_tags.join(' / ')}` : '';
  const where = state.ds === ALL_DATASETS ? `${datasetName(s.ds)} · ` : '';
  const blank = s.joints.filter((j) => !j.text).length;
  $('title').innerHTML = `<b></b><button type="button">复制路径</button> <span></span>`;
  $('title').querySelector('b').textContent = s.species;
  const copy = $('title').querySelector('button');
  copy.disabled = !s.path;
  copy.title = s.path || '该数据集没有原始素材目录';
  copy.addEventListener('click', () => {
    copy.blur();
    navigator.clipboard.writeText(s.path).then(
      () => setStatus(`已复制 ${s.path}`),
      (err) => setStatus(`复制失败：${err.message}`, true));
  });
  $('title').querySelector('span').textContent = `${where}${s.joints.length} 关节${tags} · EmbedText 为空 ${blank}`;
}

// ---------------------------------------------------------------------------
// Opening a species
// ---------------------------------------------------------------------------

async function openSpecies({ ds, species }) {
  // The latest open wins when arrow keys are held.
  const token = ++state.loadToken;
  state.opening = speciesKey({ ds, species });
  renderSpecies();
  scrollActiveIntoView();
  setStatus(`加载 ${species}…`);
  const q = `ds=${encodeURIComponent(ds)}&species=${encodeURIComponent(species)}`;
  try {
    const [payload, bvh, { clips }] = await Promise.all([
      api(`/api/joints/skeleton?${q}`), api(`/api/joints/tpose.bvh?${q}`), api(`/api/joints/clips?${q}`)]);
    if (token !== state.loadToken) return;
    state.opening = null;
    state.current = { ...payload, ds };
    fillClipOptions(clips, species);
    state.selected = new Set();
    state.anchor = null;
    buildSkeleton(bvh, payload);
    setView('fit');
    renderTable();
    renderTitle();
    renderSpecies();
    remember('species.' + state.ds, speciesKey(state.current));
    setStatus('');
    scrollActiveIntoView();
  } catch (err) {
    if (token !== state.loadToken) return;
    state.opening = null;
    renderSpecies();
    setStatus(`加载失败：${err.message}`, true);
  }
}

function scrollActiveIntoView() {
  const active = $('species').querySelector('.sp.active');
  if (active) active.scrollIntoView({ block: 'nearest' });
}

// Empty the viewport and the joint table.
function closeSpecies() {
  state.loadToken++;
  state.opening = null;
  disposeSkeleton();
  state.current = null;
  state.selected = new Set();
  state.anchor = null;
  $('tip').hidden = true;
  hoverIndex = null;
  fillClipOptions([], '');
  renderTable();
  renderTitle();
}

// Left/Right step through the open species' clips; TPose is the first entry.
function stepClip(delta) {
  const sel = $('clip');
  if (sel.disabled || !state.current) return;
  const next = Math.min(Math.max(sel.selectedIndex + delta, 0), sel.options.length - 1);
  if (next === sel.selectedIndex) return;
  sel.selectedIndex = next;
  playClip(sel.value);
}

// Arrow keys step through the species list as filtered.
function stepSpecies(delta) {
  const list = visibleSpecies();
  if (!list.length) return;
  const at = list.findIndex((s) => speciesKey(s) === activeKey());
  const next = at < 0 ? (delta > 0 ? 0 : list.length - 1)
    : Math.min(Math.max(at + delta, 0), list.length - 1);
  if (next !== at) openSpecies(list[next]);
}

// A search that matches no species empties the viewport.
function refilterSpecies() {
  renderSpecies();
  if (!visibleSpecies().length && (state.current || state.opening)) closeSpecies();
}

// ---------------------------------------------------------------------------
// Keyboard and controls
// ---------------------------------------------------------------------------

document.addEventListener('keydown', (event) => {
  const tag = (event.target.tagName || '').toLowerCase();
  // Arrow keys also work from the search box; select menus keep their own.
  if ((event.key === 'ArrowUp' || event.key === 'ArrowDown')
      && !event.ctrlKey && !event.metaKey && !event.altKey
      && (event.target === $('q') || !['input', 'select', 'textarea'].includes(tag))) {
    event.preventDefault();
    stepSpecies(event.key === 'ArrowDown' ? 1 : -1);
    return;
  }
  if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  if ((event.key === 'ArrowLeft' || event.key === 'ArrowRight')
      && !event.ctrlKey && !event.metaKey && !event.altKey && !event.shiftKey) {
    event.preventDefault();
    stepClip(event.key === 'ArrowRight' ? 1 : -1);
    return;
  }
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'a') {
    event.preventDefault();
    if (state.current) select(state.current.joints.map((j) => j.index), 'set');
    return;
  }
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const views = { Numpad1: 'front', Numpad3: 'side', Numpad7: 'top', NumpadDecimal: 'fit' };
  if (views[event.code]) { event.preventDefault(); setView(views[event.code]); return; }
  if (event.key === 'Escape') { select([], 'set'); return; }
  if (event.key === ' ') { event.preventDefault(); if (anim) setPlaying(!anim.playing); return; }
  if (event.key === ',' || event.key === '.') stepFrame(event.key === '.' ? 1 : -1);
});

$('dataset').addEventListener('change', (e) => switchDataset(e.target.value));
$('q').addEventListener('input', refilterSpecies);
$('clip').addEventListener('change', () => { $('clip').blur(); playClip($('clip').value); });
$('play').addEventListener('click', () => { $('play').blur(); if (anim) setPlaying(!anim.playing); });
$('stepBack').addEventListener('click', () => { $('stepBack').blur(); stepFrame(-1); });
$('stepFwd').addEventListener('click', () => { $('stepFwd').blur(); stepFrame(1); });
$('scrub').addEventListener('input', () => seekFrame(Number($('scrub').value)));
// Hand the keyboard back to the page shortcuts once the drag ends.
$('scrub').addEventListener('change', () => $('scrub').blur());
$('speed').value = String(playbackSpeed);
$('speed').addEventListener('change', () => {
  playbackSpeed = Number($('speed').value) || 1;
  remember('speed', $('speed').value);
  $('speed').blur();
});

fillClipOptions([], '');
loadDatasets().catch((err) => setStatus(`加载失败：${err.message}`, true));
</script>
</body>
</html>
