<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion Edit</title>
<style>
  :root {
    --bg: #15171c; --panel: #1d2027; --line: #2c313b; --text: #d8dce4; --muted: #8a93a3;
    --accent: #4fa3ff; --warn: #f0b44c; --bad: #ef6b6b; --good: #6cc785;
    --edited: #4fa3ff; --original: #c8ccd4; --contact: #ffcf4a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; }
  #app { display: grid; height: 100%; grid-template-columns: 1fr 340px;
    grid-template-rows: auto 1fr auto; grid-template-areas: "head head" "view side" "time side"; }
  header { grid-area: head; display: flex; gap: 10px; align-items: center; padding: 8px 12px;
    border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header select { min-width: min(280px, 100%); max-width: 100%; }
  #view { grid-area: view; position: relative; min-height: 0; }
  #view canvas { display: block; width: 100%; height: 100%; }
  #overlay { position: absolute; left: 10px; top: 8px; color: var(--muted); pointer-events: none;
    font-variant-numeric: tabular-nums; }
  #side { grid-area: side; border-left: 1px solid var(--line); background: var(--panel);
    overflow-y: auto; padding: 8px 12px; }
  #time { grid-area: time; border-top: 1px solid var(--line); background: var(--panel); padding: 6px 12px; }
  select, input, button { font: inherit; color: var(--text); background: #262a33;
    border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; }
  [hidden] { display: none !important; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.discard { background: #a23a3a; border-color: #a23a3a; color: #fff; }
  button.apply { background: #2f8a4c; border-color: #2f8a4c; color: #fff; }
  button.discard:hover:not(:disabled), button.apply:hover:not(:disabled) { border-color: #fff; }
  button:disabled, input:disabled { opacity: .45; cursor: default; }
  label.chk { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); }
  h3 { margin: 12px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .row { display: grid; grid-template-columns: 112px 1fr 44px 22px; gap: 6px; align-items: center; margin: 3px 0; }
  .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row input[type=range] { width: 100%; padding: 0; }
  .row .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .row button { padding: 0 4px; }
  .badge { font-size: 10px; color: var(--warn); border: 1px solid var(--warn); border-radius: 3px; padding: 0 3px; margin-left: 4px; }
  .status { margin: 6px 0; padding: 6px 8px; border-radius: 4px; background: #262a33; font-variant-numeric: tabular-nums; }
  ul.diag { list-style: none; margin: 0; padding: 0; }
  ul.diag li { padding: 4px 6px; border-bottom: 1px solid var(--line); cursor: pointer; }
  ul.diag li:hover { background: #262a33; }
  ul.diag .kind { color: var(--warn); margin-right: 6px; }
  .controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
  .controls .frame { font-variant-numeric: tabular-nums; min-width: 92px; color: var(--muted); }
  #timeline { width: 100%; display: block; cursor: ew-resize; touch-action: none; user-select: none; }
  .meta { color: var(--muted); font-size: 12px; }
  #error { color: var(--bad); }
  .contacts { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow-y: auto; }
  .contacts li { display: flex; gap: 6px; align-items: center; padding: 2px 4px; border-bottom: 1px solid var(--line); }
  .contacts li .jn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .contacts li .tag { font-size: 10px; color: var(--muted); }
  .contacts li .jn { cursor: pointer; }
  .contacts li.add .jn { color: var(--good); } .contacts li.remove .jn { color: var(--bad); text-decoration: line-through; }
  .contacts li.sel .jn { color: var(--contact); font-weight: 600; }
  .contacts li button { padding: 0 5px; }
  @media (max-width: 860px) {
    #app { grid-template-columns: 1fr; grid-template-rows: auto 55vh auto auto;
      grid-template-areas: "head" "view" "time" "side"; }
    #side { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/" } }
</script>
</head>
<body>
<div id="app">
  <header>
    <select id="pkgSelect"></select>
    <span class="meta" id="pkgMeta"></span>
    <span style="flex:1"></span>
    <label class="chk" title="关闭时保留解码出的逐帧骨骼平移，stretch_factor 不起作用"><input id="fullbodyIk" type="checkbox">fullbody IK</label>
    <label class="chk">stretch_factor <input id="stretch" type="number" min="0" max="1" step="0.01" style="width:64px"></label>
    <button id="reload">重新分解</button>
    <span id="error"></span>
  </header>
  <div id="view"><div id="overlay"></div></div>
  <div id="time">
    <div class="controls">
      <button id="play">▶</button>
      <button id="prev">◀|</button>
      <button id="next">|▶</button>
      <span class="frame" id="frameLabel">0 / 0</span>
      <label class="chk">播放速度 <select id="playRate"><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option></select></label>
      <label class="chk"><input id="loopPlay" type="checkbox" checked>循环</label>
      <label class="chk" title="播放时在相邻帧之间插值；拖动时间轴仍对齐整数帧"><input id="smooth" type="checkbox" checked>平滑插值</label>
      <span style="width:12px"></span>
      <label class="chk">对比 <select id="compare">
        <option value="overlay" selected>叠加（原始半透明）</option>
        <option value="side">左右并排</option>
        <option value="edited">仅编辑结果</option>
      </select></label>
      <label class="chk"><input id="rootMotion" type="checkbox">root motion 视图</label>
    </div>
    <canvas id="timeline" height="60"></canvas>
    <div class="controls" style="margin-top:4px">
      <span class="meta" id="maskState"></span>
      <span style="flex:1"></span>
      <span class="hint maskEditing" hidden>空白处拖动新增 · 拖动两端调整 · 点选后按 Delete 删除</span>
      <button id="maskDiscard" class="maskEditing discard" hidden>放弃</button>
      <button id="maskApply" class="maskEditing apply" hidden>应用</button>
      <button id="maskEdit">修改区间</button>
    </div>
  </div>
  <aside id="side">
    <div id="status" class="status" hidden></div>
    <div class="controls">
      <button id="resetAll">全部恢复默认</button>
    </div>
    <div id="params"></div>
    <h3>接触关节</h3>
    <div class="controls" title="接触检测以这个世界 Y 高度为地面：关节的最低处离它超过 0.3 腿长就不算着地。网格随之移动">
      <label class="chk">地面高度 <input id="groundHeight" type="number" step="0.01" style="width:72px"></label>
      <button id="groundDiscard" class="discard" hidden>放弃</button>
      <button id="groundApply" class="apply" hidden>应用</button>
    </div>
    <ul class="contacts" id="contactList"></ul>
    <div class="controls" style="margin-top:6px">
      <select id="contactAdd" style="max-width:100%"><option value="">添加关节…</option></select>
    </div>
    <div class="controls" id="jointsActions" hidden>
      <button id="jointsDiscard" class="discard">放弃</button>
      <button id="jointsPackage" class="apply">应用到本 package</button>
      <button id="jointsSpecies" class="apply" title="写入数据集的 contact_overrides.json">应用到该物种</button>
    </div>
    <h3>诊断</h3>
    <ul class="diag" id="diag"></ul>
  </aside>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/OrbitControls.js';

const $ = (id) => document.getElementById(id);
const GROUP_TITLES = { time: '时间', locomotion: 'locomotion', root: '根', amp: '幅度', force: '力度',
  secondary: '次级运动', contact: '着地' };
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

// ── state ────────────────────────────────────────────────────────────────
const state = {
  id: null, pkg: null, edited: null, params: {}, frame: 0, playing: false, clock: 0,
  highlight: -1, pending: 0,
  lap: 0,   // completed loop plays; root motion keeps travelling across the seam
  maskDraft: null,      // (K rows of F 0/1) contact intervals being edited
  selectedRun: null,    // {k, s, e} a run picked on the timeline (e may exceed F)
  jointDraft: null,     // Set of contact joints being edited
  maskEditing: false,   // the timeline edits contact intervals instead of scrubbing
  stDisplay: null,      // source time the playhead shows (fractional while interpolating)
};

// ── three.js scene ───────────────────────────────────────────────────────
const view = $('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(css('--bg'));
const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 1000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = false;   // no inertia: the view stops when the mouse does
// Blender navigation: middle = orbit, shift + middle = pan (OrbitControls pans a
// ROTATE button with shift held), wheel = zoom; left / right do nothing.
controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.ROTATE, RIGHT: null };
// no middle-click autoscroll, no context menu
renderer.domElement.addEventListener('mousedown', (e) => { if (e.button === 1) e.preventDefault(); });
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
// Right button belongs to nobody in the viewport: swallow it before the browser
// starts a mouse gesture (capture phase, default prevented).
for (const type of ['pointerdown', 'mousedown', 'mouseup', 'auxclick']) {
  view.addEventListener(type, (e) => { if (e.button === 2) { e.preventDefault(); e.stopPropagation(); } }, { capture: true });
}

let grid = null, gridCell = 1;
const ghostRoot = new THREE.Group(), editRoot = new THREE.Group(), anchorRoot = new THREE.Group();
scene.add(ghostRoot, editRoot, anchorRoot);

function makeSkeleton(color, opacity) {
  const lines = new THREE.LineSegments(new THREE.BufferGeometry(),
    new THREE.LineBasicMaterial({ color, transparent: opacity < 1, opacity, depthWrite: opacity >= 1 }));
  const points = new THREE.Points(new THREE.BufferGeometry(),
    new THREE.PointsMaterial({ size: 6, sizeAttenuation: false, vertexColors: true,
      transparent: opacity < 1, opacity, depthWrite: opacity >= 1 }));
  return { lines, points };
}
const ghost = makeSkeleton(css('--original'), 0.35);
const edit = makeSkeleton(css('--edited'), 1);
ghostRoot.add(ghost.lines, ghost.points);
editRoot.add(edit.lines, edit.points);

// Pending contact-joint changes: bigger squares drawn over everything.
const marks = new THREE.Points(new THREE.BufferGeometry(), new THREE.PointsMaterial({
  size: 9, sizeAttenuation: false, vertexColors: true, depthTest: false, depthWrite: false }));
// Joint selected in the contact panel: a thin cross behind its square (drawn after
// the bones, before the squares; neither depth-tests against it).
const CROSS = 21;   // CSS px; the point sprite is CROSS * pixel ratio device pixels
function crossTexture() {
  const dpr = renderer.getPixelRatio(), n = Math.round(CROSS * dpr) | 1, w = Math.max(1, Math.round(dpr));
  const c = document.createElement('canvas'); c.width = c.height = n;
  const g = c.getContext('2d'); g.fillStyle = '#fff';
  const o = Math.floor((n - w) / 2);
  g.fillRect(o, 0, w, n); g.fillRect(0, o, n, w);
  const t = new THREE.CanvasTexture(c);
  t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
  return t;
}
const cross = new THREE.Points(new THREE.BufferGeometry(), new THREE.PointsMaterial({
  size: CROSS, sizeAttenuation: false, map: crossTexture(), color: 0xffffff,
  alphaTest: 0.5, depthTest: false, depthWrite: false }));
cross.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(3), 3));
cross.renderOrder = 1; edit.points.renderOrder = 2; marks.renderOrder = 3;
editRoot.add(cross, marks);

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);

// ── data helpers ─────────────────────────────────────────────────────────
function jointPos(arr, J, f, j) { const o = (f * J + j) * 3; return [arr[o], arr[o + 1], arr[o + 2]]; }

function groundDisplacement(gv, F, loop, fps) {
  // cumulative v_g (XZ), two periods for a loop -- the decomposer's convention
  const n = loop ? 2 * F : F, out = new Float64Array(n * 2);
  for (let i = 1; i < n; i++) {
    const s = (i - 1) % F;
    out[i * 2] = out[(i - 1) * 2] + gv[s * 2] / fps;
    out[i * 2 + 1] = out[(i - 1) * 2 + 1] + gv[s * 2 + 1] / fps;
  }
  return out;
}

function setupSkeleton(sk, J, parents) {
  const bones = [];
  for (let j = 0; j < J; j++) if (parents[j] >= 0) bones.push(parents[j], j);
  sk.bones = bones;
  sk.lines.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(bones.length * 3), 3));
  sk.points.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(J * 3), 3));
  sk.points.geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(J * 3), 3));
}

// one frame's joint positions (J*3) at time t, linear between neighbouring frames
function sampleFrame(arr, J, n, t, loop) {
  const i0 = Math.floor(t), a = t - i0;
  const idx = (i) => loop ? ((i % n) + n) % n : Math.max(0, Math.min(n - 1, i));
  const o0 = idx(i0) * J * 3;
  if (a < 1e-6) return arr.subarray(o0, o0 + J * 3);
  const o1 = idx(i0 + 1) * J * 3, out = new Float32Array(J * 3);
  for (let i = 0; i < J * 3; i++) out[i] = arr[o0 + i] + (arr[o1 + i] - arr[o0 + i]) * a;
  return out;
}

function updateSkeleton(sk, P, offset, colorOf) {
  const { J } = state.pkg;
  const lp = sk.lines.geometry.attributes.position, pp = sk.points.geometry.attributes.position;
  const pc = sk.points.geometry.attributes.color;
  for (let i = 0; i < sk.bones.length; i++) {
    const o = sk.bones[i] * 3;
    lp.setXYZ(i, P[o] + offset[0], P[o + 1], P[o + 2] + offset[1]);
  }
  for (let j = 0; j < J; j++) {
    pp.setXYZ(j, P[j * 3] + offset[0], P[j * 3 + 1], P[j * 3 + 2] + offset[1]);
    const c = colorOf(j); pc.setXYZ(j, c.r, c.g, c.b);
  }
  lp.needsUpdate = pp.needsUpdate = pc.needsUpdate = true;
  sk.lines.geometry.computeBoundingSphere(); sk.points.geometry.computeBoundingSphere();
}

// ── package loading ──────────────────────────────────────────────────────
async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function showError(e) { $('error').textContent = e ? String(e.message || e) : ''; }

async function loadList() {
  const data = await api('/api/packages');
  const sel = $('pkgSelect');
  sel.innerHTML = '';
  for (const p of data.packages) {
    const o = document.createElement('option');
    o.value = p.id;
    o.textContent = `${p.clip} · ${p.object_type}${p.is_loop ? ' · loop' : ''}`;
    sel.appendChild(o);
  }
  const want = new URLSearchParams(location.hash.slice(1)).get('p');
  if (want && data.packages.some((p) => p.id === want)) sel.value = want;
  if (sel.value) await openPackage(sel.value);
  else { $('status').textContent = `${data.root} 下没有 package`; $('status').hidden = false; }
}

function ingest(data) {
  const m = data.manifest;
  const J = m.joint_count, F = m.frame_count;
  const pkg = {
    m, J, F, fps: m.fps, loop: m.is_loop, sk: data.skeleton,
    original: Float32Array.from(data.original.positions),
    contacts: data.contacts, gv: data.ground_velocity,
  };
  pkg.isContact = new Set(data.contacts.joints);
  pkg.speciesWritable = !!data.species_writable;
  pkg.plantAt = data.contacts.joints.map(() => new Int32Array(F).fill(-1));
  data.contacts.plants.forEach(([k, s, e], i) => { for (let u = s; u < e; u++) pkg.plantAt[k][u % F] = i; });
  pkg.disp = groundDisplacement(pkg.gv, F, pkg.loop, pkg.fps);
  // scale for grid / points / camera from the rest extent of frame 0
  let lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
  for (let j = 0; j < J; j++) {
    const p = jointPos(pkg.original, J, 0, j);
    for (let a = 0; a < 3; a++) { lo[a] = Math.min(lo[a], p[a]); hi[a] = Math.max(hi[a], p[a]); }
  }
  pkg.extent = Math.max(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2], 1e-3);
  pkg.center = [(lo[0] + hi[0]) / 2, (lo[1] + hi[1]) / 2, (lo[2] + hi[2]) / 2];
  pkg.floor = m.ground_height ?? 0;
  return pkg;
}

async function openPackage(id, payload, keepParams = false) {
  showError();
  const data = payload || await api('/api/package/' + encodeURIComponent(id).replace(/%2F/g, '/'));
  const sameClip = keepParams && state.id === id;
  state.id = id;
  state.pkg = ingest(data);
  if (!sameClip) {
    state.params = {};
    state.frame = 0; state.clock = 0; state.lap = 0;
  }
  state.edited = null;
  state.highlight = -1;
  state.maskDraft = data.contacts.mask.map((row) => row.slice());
  state.selectedRun = null;
  state.jointDraft = new Set(data.contacts.joints);
  location.hash = 'p=' + encodeURIComponent(id);
  const { m, J } = state.pkg;
  $('pkgMeta').textContent = `${m.frame_count} 帧 · ${m.fps} fps · ${J} 关节 · profile ${m.profile.status}` +
    (m.events.period ? ` · 周期 ${m.events.period}` : '');
  $('stretch').value = m.stretch_factor;
  $('groundHeight').value = state.pkg.floor;
  showGroundActions(false);
  $('fullbodyIk').checked = m.fullbody_ik ?? true;
  $('stretch').disabled = !$('fullbodyIk').checked;
  setupSkeleton(ghost, J, state.pkg.sk.parents);
  setupSkeleton(edit, J, state.pkg.sk.parents);
  marks.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(J * 3), 3));
  marks.geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(J * 3), 3));
  buildGrid();
  buildAnchors();
  buildParams();
  for (const [name, value] of Object.entries(state.params)) {
    const row = document.querySelector(`.row[data-param="${name}"]`);
    if (!row) { delete state.params[name]; continue; }
    const input = row.querySelector('input');
    if (input.type === 'checkbox') input.checked = !!value; else input.value = value;
    row.querySelector('.val').textContent = fmt(value);
  }
  renderContacts();
  setMaskEditing(false);   // the draft was just reset to the package's mask
  if (!sameClip) frameCamera();
  await applyEdit();
}

function buildGrid() {
  if (grid) scene.remove(grid);
  const { extent, m } = state.pkg;
  gridCell = Math.max(m.leg_length || extent / 4, 1e-3) / 2;
  const cells = 100;   // room for a few root-motion loops
  grid = new THREE.GridHelper(gridCell * cells, cells, 0x566074, 0x353b48);
  grid.position.y = state.pkg.floor;
  scene.add(grid);
}

function buildAnchors() {
  anchorRoot.clear();
  const { contacts, m } = state.pkg;
  const r = Math.max(m.leg_length || state.pkg.extent / 4, 1e-3) * 0.06;
  // where the edit sent each planted contact (red: IK could not reach it)
  const ring = new THREE.RingGeometry(r * 0.5, r * 0.8, 24).rotateX(-Math.PI / 2);
  const ok = new THREE.MeshBasicMaterial({ color: css('--contact'), side: THREE.DoubleSide });
  const miss = new THREE.MeshBasicMaterial({ color: css('--bad'), side: THREE.DoubleSide });
  state.pkg.targetMeshes = contacts.joints.map(() => { const mesh = new THREE.Mesh(ring, ok); anchorRoot.add(mesh); return mesh; });
  state.pkg.targetMaterials = { ok, miss };
}

function frameCamera() {
  const { extent, center } = state.pkg;
  controls.target.set(center[0], center[1], center[2]);
  camera.position.set(center[0] + extent * 1.4, center[1] + extent * 0.6, center[2] + extent * 1.8);
  camera.near = extent / 500; camera.far = extent * 500; camera.updateProjectionMatrix();
  controls.update();
}

// ── parameters ───────────────────────────────────────────────────────────
function fmt(v) { return typeof v === 'boolean' ? (v ? '开' : '关') : (+v).toFixed(2); }

function buildParams() {
  const box = $('params');
  box.innerHTML = '';
  const { m } = state.pkg;
  let group = null;
  for (const [name, spec] of Object.entries(m.params)) {
    if (!spec.available) continue;
    if (spec.group !== group) {
      group = spec.group;
      const h = document.createElement('h3'); h.textContent = GROUP_TITLES[group] || group; box.appendChild(h);
    }
    const row = document.createElement('div'); row.className = 'row';
    const label = document.createElement('span'); label.className = 'name'; label.title = name;
    label.textContent = name;
    if (!spec.implemented) { const b = document.createElement('span'); b.className = 'badge'; b.textContent = '未实现'; label.appendChild(b); }
    const val = document.createElement('span'); val.className = 'val';
    let input;
    if (spec.toggle) {
      input = document.createElement('input'); input.type = 'checkbox'; input.checked = !!spec.default;
      input.onchange = () => setParam(name, input.checked);
    } else {
      input = document.createElement('input'); input.type = 'range';
      input.min = spec.min; input.max = spec.max; input.step = (spec.max - spec.min) / 200; input.value = spec.default;
      input.oninput = () => { val.textContent = fmt(input.value); };
      input.onchange = () => setParam(name, +input.value);   // request on release only
    }
    input.disabled = !spec.implemented;
    val.textContent = fmt(spec.default);

async function applyEdit() {
  if (!state.id) return;
  const ticket = ++state.pending;   // a newer request supersedes this one
  try {

    if (ticket !== state.pending) return;
    state.edited = { positions: Float32Array.from(data.positions), F: data.frames, gv: data.ground_velocity,
      disp: groundDisplacement(data.ground_velocity, data.frames, state.pkg.loop, state.pkg.fps),
      sourceTime: data.source_time, planted: Uint8Array.from(data.planted),
      targets: Float32Array.from(data.targets), unreached: Uint8Array.from(data.unreached) };

function renderDiagnostics(applyItems) {

  for (const it of [summary, ...items]) {
    const li = document.createElement('li');

function sourceFrameToEdited(f) {

window.addEventListener('keydown', (e) => {

function maskDirty() {

// collapsed timeline: one horizontal axis with a tick per frame (0 .. F-1) above it
function drawAxis(g, L, F, x) {

  g.strokeStyle = '#5a6272'; g.lineWidth = 1;

  g.moveTo(TL.label, y); g.lineTo(TL.label + L.w, y);
  for (let f = 0; f < F; f++) {

  g.font = '10px system-ui'; g.textBaseline = 'middle';
  if (L.rows) pkg.contacts.joints.forEach((j, k) => {
    const sel = state.highlight === j;
    g.fillStyle = sel ? css('--contact') : '#8a93a3';
    g.font = sel ? 'bold 10px system-ui' : '10px system-ui';
    const name = pkg.sk.names[j];
    g.fillText(name.length > 20 ? name.slice(0, 19) + '…' : name, 2, TL.ruler + k * L.rowH + L.rowH / 2);
  });

  if (L.rows) state.maskDraft.forEach((row, k) => {

renderer.domElement.addEventListener('pointerup', (e) => {
  if (e.button !== 0 || !pickDown || !state.pkg) return;
  const moved = Math.hypot(e.clientX - pickDown[0], e.clientY - pickDown[1]); pickDown = null;
  if (moved > 4) return;
  const r = renderer.domElement.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const pos = edit.points.geometry.attributes.position, v = new THREE.Vector3();
  let best = -1, bestD = Infinity, bestZ = Infinity;
  for (let j = 0; j < pos.count; j++) {
    v.fromBufferAttribute(pos, j).applyMatrix4(edit.points.matrixWorld).project(camera);
    if (v.z < -1 || v.z > 1) continue;   // behind the camera / clipped
    const d = Math.hypot((v.x + 1) / 2 * r.width - mx, (1 - v.y) / 2 * r.height - my);
    if (d > PICK_RADIUS) continue;
    // nearest on screen; among overlapping squares, the one in front
    if (d < bestD - 0.5 || (Math.abs(d - bestD) <= 0.5 && v.z < bestZ)) { best = j; bestD = d; bestZ = v.z; }
  }
  if (best >= 0) toggleContact(best);
});

// ── draw ─────────────────────────────────────────────────────────────────
const cOrig = new THREE.Color(css('--original')), cEdit = new THREE.Color(css('--edited'));
const cContact = new THREE.Color(css('--contact'));
const cAdd = new THREE.Color('#22ff55'), cDrop = new THREE.Color('#ff2a2a');

// ground displacement at (fractional) frame t, clamped to the array
function dispAt(disp, t) {
  const n = disp.length / 2, c = Math.max(0, Math.min(n - 1, t));
  const i0 = Math.floor(c), i1 = Math.min(n - 1, i0 + 1), a = c - i0;
  return [disp[i0 * 2] + (disp[i1 * 2] - disp[i0 * 2]) * a,
          disp[i0 * 2 + 1] + (disp[i1 * 2 + 1] - disp[i0 * 2 + 1]) * a];
}

// Root-motion travel at frame t: D(t), plus a full period per completed loop play.
function travel(disp, F, t) {
  const d = dispAt(disp, t);
  if (!state.pkg.loop || !state.lap) return d;
  // a loop's displacement array spans two periods, so disp[F] is one full period
  return [state.lap * disp[F * 2] + d[0], state.lap * disp[F * 2 + 1] + d[1]];
}

function draw() {
  const pkg = state.pkg; if (!pkg || !state.edited) return;
  const f = state.frame, mode = $('compare').value, rootMotion = $('rootMotion').checked;
  const Fe = state.edited.F, J = pkg.J, F = pkg.F;
  // interpolate between frames only while playing; a paused / scrubbed frame is whole
  const smooth = state.playing && $('smooth').checked;
  const t = smooth ? state.clock : f;
  const f0 = Math.floor(t), a = t - f0;
  const f1 = pkg.loop ? f0 + 1 : Math.min(f0 + 1, Fe - 1);   // a loop's f1 may be Fe (the seam)
  // source time of edited frame i; past the seam it continues into the next period
  const srcAt = (i) => {
    const s = state.edited.sourceTime; if (!s) return i;
    return i >= Fe ? s[i - Fe] + F : s[i];
  };
  let tO;   // source frame the ghost shows
  if (smooth) tO = srcAt(f0) + (srcAt(f1) - srcAt(f0)) * a;
  else { const st = srcAt(f); tO = pkg.loop ? Math.round(st) % F : Math.min(Math.round(st), F - 1); }
  state.stDisplay = smooth ? tO : srcAt(f);

  const dE = rootMotion ? travel(state.edited.disp, Fe, t) : [0, 0];
  const dO = rootMotion ? travel(pkg.disp, F, tO) : [0, 0];
  const side = mode === 'side' ? pkg.extent * 1.2 : 0;
  const K = pkg.contacts.joints.length;
  const oE = [dE[0] + side / 2, dE[1]];
  const PE = sampleFrame(state.edited.positions, J, Fe, t, pkg.loop);
  updateSkeleton(edit, PE, oE, (j) => pkg.isContact.has(j) ? cContact : cEdit);
  ghostRoot.visible = mode !== 'edited';
  updateSkeleton(ghost, sampleFrame(pkg.original, J, F, tO, pkg.loop), [dO[0] - side / 2, dO[1]], () => cOrig);

  // pending contact-joint changes: big green (add) / red (remove) squares
  const mp = marks.geometry.attributes.position, mc = marks.geometry.attributes.color;
  let n = 0;
  for (let j = 0; j < J; j++) {
    const add = state.jointDraft.has(j);
    if (add === pkg.isContact.has(j)) continue;
    mp.setXYZ(n, PE[j * 3] + oE[0], PE[j * 3 + 1], PE[j * 3 + 2] + oE[1]);
    const c = add ? cAdd : cDrop; mc.setXYZ(n, c.r, c.g, c.b); n++;
  }
  marks.geometry.setDrawRange(0, n);
  mp.needsUpdate = mc.needsUpdate = true; marks.geometry.computeBoundingSphere();
  // joint selected in the contact panel / diagnostics
  const h = state.highlight;
  cross.visible = h >= 0 && h < J;
  if (cross.visible) {
    const cp = cross.geometry.attributes.position;
    cp.setXYZ(0, PE[h * 3] + oE[0], PE[h * 3 + 1], PE[h * 3 + 2] + oE[1]);
    cp.needsUpdate = true; cross.geometry.computeBoundingSphere();
  }

  // edited plant targets at this frame
  const g0 = Math.min(f0, Fe - 1), g1 = f1 % Fe;
  pkg.contacts.joints.forEach((j, k) => {
    const mesh = pkg.targetMeshes[k];
    const on = !!state.edited.planted[g0 * K + k];
    mesh.visible = on;
    if (!on) return;
    const tg = state.edited.targets, t0 = (g0 * K + k) * 3, t1 = (g1 * K + k) * 3;
    const b = state.edited.planted[g1 * K + k] ? a : 0;
    mesh.material = state.edited.unreached[g0 * K + k] ? pkg.targetMaterials.miss : pkg.targetMaterials.ok;
    mesh.position.set(tg[t0] + (tg[t1] - tg[t0]) * b + oE[0], tg[t0 + 1] + (tg[t1 + 1] - tg[t0 + 1]) * b + 2e-4,
                      tg[t0 + 2] + (tg[t1 + 2] - tg[t0 + 2]) * b + oE[1]);
  });

  $('frameLabel').textContent = `${f} / ${Fe - 1}`;
  $('overlay').textContent = `${pkg.m.clip} · ${pkg.m.action_label || ''}`;
  drawTimeline();
}

let last = performance.now();
function tick(now) {
  const dt = (now - last) / 1000; last = now;
  if (state.playing && state.pkg && state.edited) {
    const F = frameCount();
    state.clock += dt * state.pkg.fps * +$('playRate').value;
    if (state.clock >= F) {
      if ($('loopPlay').checked) {
        if (state.pkg.loop) state.lap += Math.floor(state.clock / F);
        state.clock %= F;
      }
      else { state.clock = F - 1; state.frame = F - 1; setPlaying(false); }
    }
    const f = Math.floor(state.clock);
    if (state.playing && (f !== state.frame || $('smooth').checked)) { state.frame = f; draw(); }
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
// Space is play / pause and nothing else: taken in the capture phase, before a
// focused button, checkbox or dropdown sees it (buttons and checkboxes fire on
// keyup, so that is swallowed too).
window.addEventListener('keydown', (e) => {
  if (e.code !== 'Space') return;
  e.preventDefault(); e.stopPropagation();
  if (!e.repeat) $('play').click();
}, { capture: true });
window.addEventListener('keyup', (e) => {
  if (e.code === 'Space') { e.preventDefault(); e.stopPropagation(); }
}, { capture: true });
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'ArrowLeft') $('prev').click();
  if (e.code === 'ArrowRight') $('next').click();
});
window.addEventListener('resize', drawTimeline);

resize();
requestAnimationFrame(tick);
loadList().catch(showError);
</script>
</body>
</html>
